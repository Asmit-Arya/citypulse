<!--
=============================================================================
FILE: static/img/logo.svg
ASSET: Brand Vector Identity - Option 2 (Geo-Radar Beacon)
-----------------------------------------------------------------------------
PURPOSE:
Combines geolocation telemetry with concentric radar broadcast rings to 
represent real-time queue visibility for local municipal businesses.

DESIGN SPECIFICATIONS:
- Canvas: 64x64 viewport with rounded corners.
- Background: Obsidian glassmorphic gradient (#111827 to #030712).
- Foreground: Geometric location pin with an embedded active telemetry wave.
=============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
    <defs>
        <!-- Dark Obsidian Background Gradient -->
        <linearGradient id="opt2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#111827" />
            <stop offset="100%" stop-color="#030712" />
        </linearGradient>

        <!-- Electric Indigo Pin Gradient -->
        <linearGradient id="opt2PinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="50%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>

        <!-- Radar Ring Pulse Gradient -->
        <linearGradient id="opt2PulseWave" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>

        <!-- Soft Glow Filter -->
        <filter id="opt2Glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Dark Obsidian Squircle Tile Base -->
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#opt2Bg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.6" />

    <!-- Outer Concentric Radar Pulse Rings -->
    <circle cx="32" cy="26" r="22" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.35" />
    <circle cx="32" cy="26" r="16" stroke="url(#opt2PulseWave)" stroke-width="1.6" stroke-opacity="0.5" />

    <!-- Geometric Location Beacon Pin -->
    <path d="M 32 49 
             C 24 39, 18 33, 18 25 
             C 18 17.2, 24.2 11, 32 11 
             C 39.8 11, 46 17.2, 46 25 
             C 46 33, 40 39, 32 49 Z" 
          fill="url(#opt2PinGrad)" 
          stroke="rgba(255, 255, 255, 0.25)" 
          stroke-width="1.2" 
          filter="url(#opt2Glow)" />

    <!-- Center Pulse Telemetry Line inside the Pin -->
    <path d="M 23 25 L 28 25 L 30 20 L 33 29 L 36 22 L 38 25 L 41 25" 
          stroke="#ffffff" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ground Reflection Accent -->
    <ellipse cx="32" cy="53" rx="6" ry="1.8" fill="#38bdf8" fill-opacity="0.4" filter="url(#opt2Glow)" />
</svg>
