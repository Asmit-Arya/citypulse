<!--
=============================================================================
FILE: templates/index.html
ROLE: Presentation Structure Layer (Teammate 1)
-----------------------------------------------------------------------------
PURPOSE:
Provides dual-mode functionality through a clean view-toggle:
1. Customer Discovery View: Filter businesses, view live queues, and join virtual waitlists.
2. Merchant Live Console: High-contrast controls to seat patrons and complete services.
=============================================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Real-Time Operational Visibility</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Dark Obsidian Theme -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- 1. Top Navbar & View Switcher -->
    <nav class="navbar navbar-expand-lg cp-navbar sticky-top py-2">
        <div class="container d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center">
                <span class="brand-title">CityPulse</span>
                <span class="badge badge-wait-pill ms-3 d-none d-md-inline" id="dynamicWaitBadge">~20-30 mins wait</span>
            </div>

            <!-- View Switcher -->
            <div class="nav-pill-switcher d-flex">
                <button type="button" class="btn active" id="btnViewCustomer" onclick="switchView('customer')">
                    Customer Discovery
                </button>
                <button type="button" class="btn" id="btnViewMerchant" onclick="switchView('merchant')">
                    Merchant Console
                </button>
            </div>

        </div>
    </nav>

    <!-- 2. Customer Discovery View -->
    <main class="container my-4" id="viewCustomer">
        
        <!-- Filter Controls -->
        <div class="cp-card p-3 mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input type="text" id="searchInput" class="form-control cp-input" placeholder="Search businesses by name...">
                </div>
                <div class="col-md-3">
                    <select id="cityFilter" class="form-select cp-select">
                        <option value="">All Municipalities</option>
                        <option value="Raipur">Raipur</option>
                        <option value="Bhilai">Bhilai</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="categoryFilter" class="form-select cp-select">
                        <option value="">All Industry Categories</option>
                        <option value="Salon">Salon & Personal Care</option>
                        <option value="Healthcare">Healthcare & Clinics</option>
                        <option value="Automotive">Automotive & Repair</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Dynamic Grid of Business Cards -->
        <div class="row g-3" id="businessCardsGrid">
            <!-- Rendered by ui.js -->
        </div>

    </main>

    <!-- 3. Merchant Live Console (Hidden by default) -->
    <main class="container my-4 d-none" id="viewMerchant">
        <div class="row">

            <!-- Active Chair & Walk-In Intake -->
            <div class="col-md-5 mb-4">
                <h6 class="text-uppercase text-muted fw-bold mb-3 small" style="letter-spacing: 0.5px;">Current Workstation</h6>
                
                <div id="activeChairContainer">
                    <!-- Populated dynamically by api.js -->
                </div>

                <div class="cp-card p-3 mt-3">
                    <h6 class="fw-bold mb-2">Register In-Person Walk-In</h6>
                    <form id="walkInForm">
                        <div class="mb-2">
                            <input type="text" id="walkInCustomerName" class="form-control cp-input form-control-sm" placeholder="Customer Name (e.g., Amit)" required>
                        </div>
                        <div class="mb-3">
                            <select id="walkInServiceSelect" class="form-select cp-select form-select-sm">
                                <option value="1">Standard Haircut (~20m)</option>
                                <option value="2">Beard Trim & Lineup (~10m)</option>
                                <option value="3">Hair Color & Styling (~45m)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-cp-primary w-100 btn-sm">+ Add to Queue</button>
                    </form>
                </div>
            </div>

            <!-- Waiting Queue -->
            <div class="col-md-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="text-uppercase text-muted fw-bold mb-0 small" style="letter-spacing: 0.5px;">Patrons in Waiting Queue</h6>
                    <span class="badge badge-wait-pill">Auto-refreshes 10s</span>
                </div>

                <div class="cp-card p-0 overflow-hidden">
                    <ul class="list-group list-group-flush queue-list-container" id="merchantQueueList">
                        <!-- Populated dynamically by api.js -->
                    </ul>
                </div>
            </div>

        </div>
    </main>

    <!-- 4. Online Booking Modal -->
    <div class="modal fade" id="customerBookingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content cp-modal">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="customerBookingModalTitle">Join Virtual Queue</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="onlineBookingForm">
                    <div class="modal-body">
                        <input type="hidden" id="modalBusinessId">
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Full Name</label>
                            <input type="text" class="form-control cp-input" id="onlineCustomerName" placeholder="e.g., Rahul Verma" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Select Service</label>
                            <select class="form-select cp-select" id="onlineServiceSelect">
                                <option value="1">Standard Haircut (20 mins)</option>
                                <option value="2">Beard Trim & Lineup (10 mins)</option>
                                <option value="3">Hair Color & Styling (45 mins)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Special Requests / Notes (AI Triage)</label>
                            <textarea class="form-control cp-input" id="onlineCustomerNotes" rows="2" placeholder="e.g., Need skin fade with beard wash"></textarea>
                            <small class="text-muted">Our AI triage engine analyzes your notes to adjust wait estimates.</small>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-cp-outline" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-cp-primary">Confirm & Join</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
</body>
</html>
