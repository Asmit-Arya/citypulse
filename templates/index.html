<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Merchant Operations & Live Console</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">CityPulse Merchant Console</span>
            <span class="badge bg-primary px-3 py-2 fs-6" id="dynamicWaitBadge">Loading wait...</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            
            <!-- Left Column: Active in Chair & Walk-In Form -->
            <div class="col-md-5 mb-4">
                <h5 class="fw-bold text-secondary">Active Workstation</h5>
                <div id="activeChairContainer">
                    <!-- Populated dynamically by api.js -->
                </div>

                <!-- Add Walk-In Card -->
                <div class="card p-3 shadow-sm border-0 mt-3">
                    <h6 class="fw-bold mb-2">Register Walk-in Customer</h6>
                    <form id="walkInForm">
                        <div class="mb-2">
                            <input type="text" id="walkInCustomerName" class="form-control form-control-sm" placeholder="Customer Name (e.g. Amit)" required>
                        </div>
                        <div class="mb-3">
                            <select id="walkInServiceSelect" class="form-select form-select-sm">
                                <option value="1">Standard Haircut (~20m)</option>
                                <option value="2">Beard Trim & Lineup (~10m)</option>
                                <option value="3">Hair Color & Styling (~45m)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark btn-sm w-100">+ Add Walk-In</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Live Waiting Queue -->
            <div class="col-md-7">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold text-secondary mb-0">Upcoming Patrons</h5>
                    <small class="text-muted">Auto-refreshes every 10s</small>
                </div>
                <div class="card shadow-sm border-0">
                    <ul class="list-group list-group-flush" id="merchantQueueList">
                        <!-- Populated dynamically by api.js -->
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts: Bootstrap first, then your api.js bridge -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
</body>
</html>
